spring:
  datasource:                                          # DB 접속 설정
    url: ${SPRING_DATASOURCE_URL}                      # 접속 주소. compose 의 environment 에서 받는다
    username: ${SPRING_DATASOURCE_USERNAME}            # 사용자명. compose 의 environment 에서 받는다
    password: ${SPRING_DATASOURCE_PASSWORD}            # 비밀번호. docker-entrypoint.sh 가 시크릿 파일에서 읽어 넣는다
    driver-class-name: com.mysql.cj.jdbc.Driver        # MySQL JDBC 드라이버 클래스
  jpa:
    hibernate:
      ddl-auto: update                                 # 엔티티에 맞춰 테이블을 만들거나 컬럼을 추가한다(데이터는 지우지 않는다)
    show-sql: false                                    # 실행되는 SQL 을 로그에 찍지 않는다

server:
  port: 8080                                           # 앱이 요청을 받을 포트
