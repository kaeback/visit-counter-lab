upstream app {                                              # 요청을 넘길 백엔드 서버 묶음에 app 이라는 이름을 붙인다
    server app:8080;                                        # compose 서비스 이름 app 의 8080 포트(Docker DNS 가 IP 로 바꿔 준다)
}
server {                                                    # 가상 서버 하나
    listen 80;                                              # 컨테이너의 80 포트에서 요청을 받는다
    location / {                                            # 모든 경로(/ 로 시작하는 요청)에 적용
        proxy_pass         http://app;                      # 위 upstream app 으로 요청을 전달한다
        proxy_set_header   Host              $host;                       # 클라이언트가 요청한 호스트명을 그대로 넘긴다
        proxy_set_header   X-Real-IP         $remote_addr;                # 실제 클라이언트 IP
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;  # 거쳐 온 프록시 IP 목록에 클라이언트 IP 를 덧붙인다
        proxy_set_header   X-Forwarded-Proto $scheme;                     # 원래 요청이 http 인지 https 인지
    }
}
