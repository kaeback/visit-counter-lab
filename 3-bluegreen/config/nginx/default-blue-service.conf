# deploy.sh 가 blue 로 전환할 때 nginx 컨테이너의 default.conf 자리에 복사하는 설정
upstream service {                                          # 요청을 넘길 백엔드 묶음에 service 라는 이름을 붙인다
    server blue-service:8080;                               # blue-service 컨테이너의 8080 포트(같은 Docker 네트워크의 이름으로 찾는다)
}

server {                                                    # 가상 서버 하나
    listen       80;                                        # IPv4 80 포트에서 요청을 받는다
    listen  [::]:80;                                        # IPv6 80 포트에서도 받는다
    server_name  localhost;                                 # 이 서버 블록이 응답할 호스트명

    location / {                                            # 모든 경로에 적용
        proxy_pass http://service;                          # 위 upstream service 로 요청을 전달한다
        proxy_set_header Host $host;                        # 클라이언트가 요청한 호스트명을 그대로 넘긴다
        proxy_set_header X-Real-IP $remote_addr;            # 실제 클라이언트 IP
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 거쳐 온 프록시 IP 목록에 클라이언트 IP 를 덧붙인다
        proxy_set_header X-Forwarded-Proto $scheme;         # 원래 요청이 http 인지 https 인지
    }

    error_page   500 502 503 504  /50x.html;                # 백엔드 오류 시 /50x.html 을 대신 보여준다
    location = /50x.html {                                  # 정확히 /50x.html 요청일 때
        root   /usr/share/nginx/html;                       # nginx 이미지에 들어 있는 기본 오류 페이지 위치
    }
}
