# 실습 4-7 (예제 1): push 하면 테스트만 자동으로 돈다
# 내 저장소의 .github/workflows/deploy.yml 로 복사해서 쓴다.
# 4-8, 4-10 에서 같은 파일에 job·step 을 더해 배포까지 키운다(그래서 이름이 처음부터 deploy).
name: deploy                     # Actions 탭에 보이는 워크플로 이름

on:                              # 워크플로를 실행할 이벤트
  push:                          # push 가 일어났을 때
    branches: [main]             # main 브랜치에 한해서만

permissions:                     # 이 워크플로의 GITHUB_TOKEN 이 가질 권한
  contents: read                 # 저장소 코드 읽기(checkout 에 필요)

jobs:                            # 실행할 job 목록
  # ── CI: 테스트 ─────────────────────────────────────────────
  test:                          # job 이름
    runs-on: ubuntu-latest       # GitHub 가 제공하는 최신 Ubuntu 러너에서 실행한다
    steps:                       # 순서대로 실행할 단계
      - uses: actions/checkout@v7  # 저장소 코드를 러너로 내려받는다

      - uses: actions/setup-java@v6  # 러너에 JDK 를 설치한다
        with:
          distribution: temurin  # Eclipse Temurin 배포판
          java-version: '21'     # Java 21

      # Gradle 을 설치하고, 내려받은 의존성을 실행 사이에 캐시한다
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'  # Dockerfile 과 같은 Gradle 버전

      - name: 테스트             # 로그에 표시될 단계 이름
        run: gradle test --no-daemon  # 테스트를 실행한다. 실패하면 여기서 워크플로가 멈춘다
