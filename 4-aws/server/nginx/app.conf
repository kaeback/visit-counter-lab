# /etc/nginx/default.d/ 에 두면 기본 nginx.conf 의 server 블록 안에 포함된다
include /etc/nginx/conf.d/service-url.inc;                  # $service_url 변수를 정의한 파일을 읽어 온다(배포 때 이 파일만 바뀐다)

location / {                                                # 모든 경로에 적용
    proxy_pass          $service_url;                       # 현재 서비스 중인 blue/green 컨테이너 주소로 전달한다
    proxy_set_header    Host $http_host;                    # 클라이언트가 보낸 Host 헤더(포트 포함)를 그대로 넘긴다
    proxy_set_header    X-Real-IP $remote_addr;             # 실제 클라이언트 IP
    proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;  # 거쳐 온 프록시 IP 목록에 클라이언트 IP 를 덧붙인다
    proxy_set_header    X-Forwarded-Proto $scheme;          # 원래 요청이 http 인지 https 인지
}

# 관리용 엔드포인트는 인터넷에 내보내지 않는다
location = /actuator  { deny all; }                         # 정확히 /actuator 요청 차단(403)
location /actuator/   { deny all; }                         # /actuator/ 아래 모든 경로 차단(헬스체크는 서버 안에서 직접 포트로 한다)
