name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write        # GHCR 에 올리려면 필요하다

# 배포는 한 번에 하나만 돈다. 앞 배포가 끝날 때까지 다음 실행은 기다린다.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # ── CI: 테스트가 통과해야 다음 job 이 돈다 ───────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 을 설치하고, 내려받은 의존성을 실행 사이에 캐시한다
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: 테스트
        run: gradle test --no-daemon

  # ── CD: 이미지 빌드 → GHCR → EC2 배포 ───────────────────────
  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # GHCR 은 이미지 이름이 전부 소문자여야 한다.
      # 사용자명에 대문자가 있으면 그대로 쓸 수 없어 여기서 변환한다.
      - name: 이미지 이름 결정
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visit-counter" >> $GITHUB_ENV

      - name: GHCR 로그인
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # 따로 발급하지 않아도 된다

      # 빌드 캐시를 GitHub 에 저장하려면 buildx 빌더가 필요하다
      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: EC2 에 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}   # 진짜 내 서버인지 확인
          script: ~/deploy.sh ${{ github.sha }}
