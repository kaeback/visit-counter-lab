name: deploy                     # Actions 탭에 보이는 워크플로 이름

on:                              # 워크플로를 실행할 이벤트
  push:                          # push 가 일어났을 때
    branches: [main]             # main 브랜치에 한해서만

permissions:                     # 이 워크플로의 GITHUB_TOKEN 이 가질 권한
  contents: read                 # 저장소 코드 읽기(checkout 에 필요)
  packages: write        # GHCR 에 올리려면 필요하다

# 배포는 한 번에 하나만 돈다. 앞 배포가 끝날 때까지 다음 실행은 기다린다.
concurrency:
  group: deploy                  # 같은 그룹 이름을 가진 실행끼리 겹치지 않는다
  cancel-in-progress: false      # 진행 중인 배포를 취소하지 않고 끝날 때까지 기다린다

jobs:                            # 실행할 job 목록
  # ── CI: 테스트가 통과해야 다음 job 이 돈다 ───────────────────
  test:                          # job 이름
    runs-on: ubuntu-latest       # GitHub 가 제공하는 최신 Ubuntu 러너에서 실행한다
    steps:                       # 순서대로 실행할 단계
      - uses: actions/checkout@v7  # 저장소 코드를 러너로 내려받는다

      - uses: actions/setup-java@v6  # 러너에 JDK 를 설치한다
        with:
          distribution: temurin  # Eclipse Temurin 배포판
          java-version: '21'     # Java 21

      # Gradle 을 설치하고, 내려받은 의존성을 실행 사이에 캐시한다
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'  # Dockerfile 과 같은 Gradle 버전

      - name: 테스트             # 로그에 표시될 단계 이름
        run: gradle test --no-daemon  # 테스트를 실행한다. 실패하면 여기서 워크플로가 멈춘다

  # ── CD: 이미지 빌드 → GHCR → EC2 배포 ───────────────────────
  build-and-deploy:              # job 이름
    needs: test                  # test job 이 성공해야 시작한다
    runs-on: ubuntu-latest       # 최신 Ubuntu 러너에서 실행한다

    steps:
      - uses: actions/checkout@v7  # 저장소 코드를 내려받는다(job 마다 러너가 새로 뜬다)

      # GHCR 은 이미지 이름이 전부 소문자여야 한다.
      # 사용자명에 대문자가 있으면 그대로 쓸 수 없어 여기서 변환한다.
      # ${VAR,,} 는 bash 의 소문자 변환이다. $GITHUB_ENV 에 쓰면 이후 단계에서 env.IMAGE 로 쓸 수 있다
      - name: 이미지 이름 결정
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/visit-counter" >> $GITHUB_ENV

      - name: GHCR 로그인
        uses: docker/login-action@v4  # docker login 을 대신 해 주는 액션
        with:
          registry: ghcr.io      # 로그인할 레지스트리
          username: ${{ github.actor }}  # 워크플로를 실행한 GitHub 사용자
          password: ${{ secrets.GITHUB_TOKEN }}   # 따로 발급하지 않아도 된다

      # 빌드 캐시를 GitHub 에 저장하려면 buildx 빌더가 필요하다
      - uses: docker/setup-buildx-action@v4

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v7  # docker build + push 를 한 번에 하는 액션
        with:
          context: .             # 저장소 루트를 빌드 컨텍스트로 쓴다(루트의 Dockerfile 사용)
          push: true             # 빌드 후 레지스트리로 올린다
          tags: ${{ env.IMAGE }}:${{ github.sha }}  # 커밋 해시를 태그로 써서 어떤 커밋의 이미지인지 알 수 있게 한다
          cache-from: type=gha   # GitHub Actions 캐시에서 이전 빌드 레이어를 가져온다
          cache-to: type=gha,mode=max  # 모든 단계(빌드 단계 포함)의 레이어를 캐시에 저장한다

      - name: EC2 에 배포
        uses: appleboy/ssh-action@v1  # SSH 로 서버에 접속해 명령을 실행하는 액션
        with:
          host: ${{ secrets.EC2_HOST }}  # 서버 주소(저장소 Secrets 에 등록)
          username: ec2-user     # Amazon Linux 기본 사용자
          key: ${{ secrets.EC2_SSH_KEY }}  # 배포 전용 SSH 개인 키
          fingerprint: ${{ secrets.EC2_HOST_FINGERPRINT }}   # 진짜 내 서버인지 확인
          # 서버에서 실행할 명령. deploy-gate 가 이 형식("~/deploy.sh <40자 해시>")만 허용한다
          script: ~/deploy.sh ${{ github.sha }}
