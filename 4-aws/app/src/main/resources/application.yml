spring:
  datasource:                                          # DB 접속 설정
    url: ${SPRING_DATASOURCE_URL}                      # 접속 주소. ~/app.env 에서 환경 변수로 받는다
    username: ${SPRING_DATASOURCE_USERNAME}            # 사용자명. ~/app.env 에서 받는다
    password: ${SPRING_DATASOURCE_PASSWORD}            # 비밀번호. ~/app.env 에서 받는다
    hikari:                                            # Spring Boot 기본 커넥션 풀(HikariCP) 설정
      # 블루·그린 배포 중에는 컨테이너 두 개가 잠시 동시에 뜬다.
      # 그만큼 커넥션도 두 배가 되므로 넉넉하게 잡지 않는다.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update                                 # 엔티티에 맞춰 테이블을 만들거나 컬럼을 추가한다(데이터는 지우지 않는다)
