services:
  web:
    image: nginx:1.30
    ports:
      - "${WEB_PORT}:80"                    # .env 의 WEB_PORT 로 치환
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro   # 바인드 마운트(읽기 전용)
      - ./web/html:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy          # api 가 healthy 가 된 뒤 시작
  api:
    build: ./api                            # ports 없음 → PC에서 직접 접근 불가
    environment:
      GREETING: ${GREETING}
    secrets:
      - api_key                             # /run/secrets/api_key 로 마운트
    volumes:
      - api-data:/data                      # Named Volume
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  api-data:

secrets:
  api_key:
    file: ./secrets/api_key.txt
